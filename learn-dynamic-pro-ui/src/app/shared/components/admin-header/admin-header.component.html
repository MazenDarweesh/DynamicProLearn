<header class="console-header" dir="rtl">
  <div class="header-content">
    <div class="brand w-100 d-flex justify-between align-center">
      <h1>DynamicProLearn <span class="font-light">لوحة تحكم الأدمن</span></h1>
      <div class="logout-container">
        <button class="btn-logout" (click)="logout()">تسجيل الخروج</button>
      </div>
    </div>
    <nav class="header-nav">
      <button class="nav-btn" [class.active]="currentRoute === '/admin'" (click)="goTo('/admin')">الرئيسية <span class="icon">🏠</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/users'" (click)="goTo('/admin/users')">الشركات <span class="icon">🏢</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/content'" (click)="goTo('/admin/content')">الموديولات <span class="icon">📚</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/assignments'" (click)="goTo('/admin/assignments')">التحليلات <span class="icon">📊</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/testers'" (click)="goTo('/admin/testers')">المختبرون <span class="icon">🧪</span></button>
    </nav>
  </div>
</header>
