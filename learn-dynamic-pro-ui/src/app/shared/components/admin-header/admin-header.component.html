<header class="console-header" dir="rtl">
  <div class="header-content">
    <div class="brand w-100 d-flex justify-between align-center">

      <!-- Right Side: Logo, Branding, and Page Title -->
      <div class="d-flex align-center gap-4">
        <div class="d-flex align-center gap-2"
          style="padding-left: 20px; border-left: 1px solid rgba(255,255,255,0.2);">
          <img src="/favicon.ico" alt="DynamicProLearn Logo"
            style="height: 36px; background: white; padding: 3px; border-radius: 8px;">
          <span class="fw-bold" style="font-size: 20px; color: white;">DynamicPro<span
              style="color: var(--color-accent, #f58220);">Learn</span></span>
        </div>

        <div>
          <h1 class="m-0" style="display: flex; align-items: center; gap: 8px; font-size: 20px; color: white;">
            {{ title || 'لوحة تحكم الأدمن' }}
          </h1>
          <div class="d-flex align-center gap-1 m-0 text-sm" style="color: rgba(255,255,255,0.8); margin-top: 4px !important;">
            <span class="icon" style="font-size: 14px;">👤</span> أهلاً بك، {{ userName() || 'المستخدم' }}
          </div>
        </div>
      </div>

      <!-- Left Side: Back Button & Logout -->
      <div class="d-flex align-center gap-3">
        <button *ngIf="showBackBtn" class="btn-back-header" (click)="goBack()">
          <i class="fi fi-rr-arrow-right"></i> عودة
        </button>
        <button class="btn-logout" (click)="logout()">تسجيل الخروج</button>
      </div>

    </div>
    <nav class="header-nav" *ngIf="userRole() === 'Admin'">
      <button class="nav-btn" [class.active]="currentRoute === '/admin'" (click)="goTo('/admin')">الرئيسية <span
          class="icon">🏠</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/companies'"
        (click)="goTo('/admin/companies')">الشركات <span class="icon">🏢</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/content'"
        (click)="goTo('/admin/content')">الموديولات <span class="icon">📚</span></button>
      <button class="nav-btn" [class.active]="currentRoute.startsWith('/admin/analytics')"
        (click)="goTo('/admin/analytics')">الدروس <span class="icon">📈</span></button>
      <button class="nav-btn" [class.active]="currentRoute === '/admin/employees'"
        (click)="goTo('/admin/employees')">الموظفون <span class="icon">👥</span></button>
      <button class="nav-btn" [class.active]="currentRoute.startsWith('/admin/testers') || currentRoute.startsWith('/admin/versions')"
        (click)="goTo('/admin/testers')">المختبرون <span class="icon">🧪</span></button>
    </nav>

    <div class="tabs-header d-flex gap-3 pt-3" *ngIf="userRole() === 'Student'">
      <button class="btn-tab" [class.active]="isStudentTabActive('resume')" (click)="goToStudentTab('resume')">متابعة التعلم</button>
      <button class="btn-tab" [class.active]="isStudentTabActive('browse')" (click)="goToStudentTab('browse')">تصفح الموديولات</button>
    </div>

    <ng-content></ng-content>
  </div>
</header>
