<div class="dashboard-container" dir="rtl">
  <div *ngIf="!isLoading">
    <div class="d-flex justify-between w-100 align-center mb-4">
      <h2 class="m-0" style="color: var(--color-navy)">{{ title }}</h2>
      <div class="d-flex align-center gap-3">
        <button (click)="toggleExpandAll()" 
                style="background: rgba(67, 56, 202, 0.1); color: #4338ca; padding: 10px 15px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 14px; transition: opacity 0.2s;"
                onmouseover="this.style.opacity='0.8'"
                onmouseout="this.style.opacity='1'">
          <i class="fi" [ngClass]="isAllExpanded ? 'fi-rr-compress-alt' : 'fi-rr-expand-arrows-alt'" style="margin-top: 3px;"></i>
          {{ isAllExpanded ? 'إخفاء الكل' : 'عرض الكل' }}
        </button>

        <button (click)="exportToExcel()" class="btn-green d-flex align-center gap-2" style="padding: 10px 15px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; font-family: inherit;">
          <i class="fi fi-rr-file-excel"></i> تصدير إكسيل
        </button>

        <div class="stats-badge" style="background: rgba(245, 130, 32, 0.1); color: var(--brand-orange); padding: 10px 15px; border-radius: 8px; font-weight: 500; font-size: 14px; display: flex; align-items: center;">
          <span>الدروس المكتملة: <strong style="font-size: 16px;">{{ completedLessons }}</strong></span>
        </div>
        <div class="stats-badge" style="background: rgba(67, 56, 202, 0.1); color: var(--brand-blue); padding: 10px 15px; border-radius: 8px; font-weight: 500; font-size: 14px; display: flex; align-items: center;">
          <span>إجمالي الدروس المسندة: <strong style="font-size: 16px;">{{ totalAssignedLessons }}</strong></span>
        </div>
      </div>
    </div>

    <!-- Progress Bar Top Card -->
    <div class="card p-4 mb-4" style="border: 1px solid rgba(0,0,0,0.05); border-radius: 12px;">
      <div class="d-flex align-center gap-3 mb-3">
        <div style="background: rgba(245, 130, 32, 0.1); color: var(--color-accent); padding: 12px; border-radius: 50%;">
          <i class="fi" [ngClass]="filterType === 'version' ? 'fi-rr-test' : 'fi-rr-code-branch'" style="font-size: 24px;"></i>
        </div>
        <div>
          <h3 class="m-0 text-primary" style="font-size: 18px;">{{ name }}</h3>
          <p class="m-0 text-secondary" style="font-size: 14px;">{{ subtitle }}</p>
        </div>
      </div>
      
      <div class="w-100 mt-2">
        <app-progress-bar 
          [completed]="completedLessons" 
          [total]="totalAssignedLessons">
        </app-progress-bar>
      </div>
    </div>

    <div class="card p-0">
      <!-- Filters -->
      <div *ngIf="filterOptions.length > 0" class="filter-container d-flex gap-3 align-center p-4" style="border-bottom: 1px solid rgba(0,0,0,0.05); background-color: #f8fafc; border-radius: 12px 12px 0 0;">
        <div style="flex: 1; position: relative;">
          <i class="fi fi-rr-search" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--color-primary);"></i>
          <input type="text" class="form-control" style="background-image: none; padding-right: 40px; padding-left: 15px; margin: 0; background-color: white;" placeholder="ابحث باسم الدرس..." [(ngModel)]="searchQuery" (input)="applyFilters()" />
        </div>
        <div style="width: 250px;">
          <select class="form-control" style="margin: 0; background-color: white;" [(ngModel)]="selectedFilterValue" (change)="applyFilters()">
            <option value="">{{ filterType === 'version' ? 'كل النسخ' : 'كل المختبرين' }}</option>
            <option *ngFor="let opt of filterOptions" [value]="opt">{{ opt }}</option>
          </select>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="filteredGroups.length === 0" class="empty-state p-5" style="text-align: center; color: #64748b;">
        <i class="fi fi-rr-folder-open mb-3" style="font-size: 40px; color: rgba(0,0,0,0.1);"></i>
        <h3 class="m-0">لا توجد تقييمات</h3>
        <p class="mt-2">لم يتم العثور على أي بيانات مطابقة.</p>
      </div>

      <!-- Feedbacks Table -->
      <div *ngFor="let group of filteredGroups" class="mb-5">
        <div style="background: rgba(67, 56, 202, 0.05); padding: 15px 20px; border-radius: 12px 12px 0 0; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: -1px; position: relative; z-index: 1;">
          <h3 class="m-0" style="color: var(--color-navy); display: flex; align-items: center; gap: 10px; font-size: 16px;">
            <i class="fi" [ngClass]="filterType === 'version' ? 'fi-rr-code-branch' : 'fi-rr-user'" style="color: var(--color-primary); font-size: 18px;"></i> {{ group.groupName }}
          </h3>
        </div>
        <div style="border: 1px solid rgba(0,0,0,0.05); border-radius: 0 0 12px 12px;">
          <app-curriculum-viewer 
            *ngIf="group.modules.length > 0"
            [modules]="group.modules"
            [isAllExpanded]="isAllExpanded"
            [isLoading]="isLoading"
            [isDepartmentView]="false"
            [isStudentView]="false"
            [isTesterView]="true">
          </app-curriculum-viewer>
        </div>
      </div>
    </div>
  </div>
  
  <div *ngIf="isLoading" class="d-flex align-center w-100" style="justify-content: center; height: 50vh;">
    <div style="text-align: center;">
      <i class="fi fi-rr-spinner" style="font-size: 32px; color: var(--color-primary); display: inline-block; animation: spin 1s linear infinite;"></i>
      <p class="text-secondary mt-3" style="font-size: 18px; margin: 0;">جاري تحميل البيانات...</p>
    </div>
  </div>
</div>
