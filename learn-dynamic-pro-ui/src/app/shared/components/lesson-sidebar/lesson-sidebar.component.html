<div class="viewer-sidebar">
  <div *ngIf="isLoading" class="loading">جاري التحميل...</div>
  
  <div *ngIf="!isLoading && uniqueLevels.length > 0" class="filter-container" style="margin-bottom: 20px;">
    <input type="text" class="form-control" style="background-image: none; padding-left: 15px; margin-bottom: 10px;" placeholder="ابحث باسم الدرس..." [(ngModel)]="searchQuery" (input)="applyFilters()" />
    <div style="display: flex; gap: 10px;">
      <select class="form-control" [(ngModel)]="selectedLevel" (change)="applyFilters()">
        <option value="">كل المستويات</option>
        <option *ngFor="let lvl of uniqueLevels" [value]="lvl">{{ lvl }}</option>
      </select>
      <select class="form-control" [(ngModel)]="selectedType" (change)="applyFilters()">
        <option value="">كل الأنواع</option>
        <option *ngFor="let t of uniqueTypes" [value]="t">{{ t }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="!isLoading && filteredData.length === 0" class="empty-state">لا يوجد محتوى.</div>

  <div class="unit" *ngFor="let group of filteredData; let i = index">
    <h4 *ngIf="type === 'units'">{{ i + 1 }}. {{ group.title }}</h4>
    <h4 *ngIf="type === 'levels'" style="color: var(--color-accent);"><i class="fi fi-rr-layer-group"></i> مستوى: {{ group.levelLabel }}</h4>

    <div *ngIf="group.lessons && group.lessons.length === 0" class="text-secondary text-sm"
      style="padding-right: 15px;">
      لا توجد دروس مطابقة للبحث
    </div>

    <div class="lesson-item" *ngFor="let lesson of group.lessons; let lIndex = index"
      [class.active]="activeLessonId === lesson.id" (click)="onLessonSelect(lesson.id)">

      <div style="display: flex; align-items: center; gap: 10px;">
        <svg *ngIf="lesson.typeLabel === 'Video' || lesson.typeLabel === 'فيديو'" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <svg *ngIf="lesson.typeLabel !== 'Video' && lesson.typeLabel !== 'فيديو'" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>

        <span *ngIf="type === 'units'">{{ i + 1 }}.{{ lIndex + 1 }} {{ lesson.title }}</span>
        <span *ngIf="type === 'levels'">{{ lesson.title }}</span>
        <span *ngIf="lesson.hasSummary" class="ai-badge-indicator" title="يحتوي على ملخص ذكي">📝</span>
        <span *ngIf="lesson.hasQuiz" class="ai-badge-indicator" title="يحتوي على اختبار تفاعلي">🧠</span>
      </div>

      <div class="lesson-status" [class.completed]="lesson.isCompleted">
        <svg *ngIf="lesson.isCompleted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>
  </div>
</div>
