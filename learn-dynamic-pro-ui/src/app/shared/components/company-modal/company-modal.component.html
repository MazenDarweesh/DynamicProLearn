<div class="modal-overlay " *ngIf="show" dir="rtl">
  <div class="modal-container" style="max-width: 600px;">
    <div class="modal-header">
      <div class="d-flex justify-between align-center">
        <div>
          <h3 class="m-0 text-white d-flex align-center gap-2">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            {{ editingCompanyId ? 'تعديل شركة' : 'إضافة شركة جديدة' }}
          </h3>
          <p class="text-white-50 m-0 text-sm mt-1" style="padding-right: 28px;">إدارة بيانات الشركة والأقسام التابعة لها</p>
        </div>
        <button class="icon-btn text-white" (click)="closeModal()" style="margin-left: -10px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="modal-body" style="padding: 24px;">
      <div class="form-group mb-3">
        <label class="form-label text-secondary text-sm mb-2 d-block">اسم الشركة <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="companyName" placeholder="أدخل اسم الشركة">
      </div>

      <!-- Departments Management -->
      <div class="form-group mt-4 pt-3 border-top">
        <label class="form-label text-secondary text-sm mb-3 d-block">أقسام الشركة</label>
        
        <div class="departments-list mb-3" style="max-height: 200px; overflow-y: auto;">
          <div *ngIf="departmentsList.length === 0" class="text-secondary text-sm mb-2 text-center py-2" style="background: var(--color-bg-page); border-radius: 6px;">
            لا توجد أقسام مضافة بعد.
          </div>
          
          <div *ngFor="let dept of departmentsList; let i = index" class="d-flex align-center gap-2 mb-2">
            <input type="text" class="form-control flex-1" [(ngModel)]="dept.name" placeholder="اسم القسم">
            <button class="btn-icon-danger flex-shrink-0" (click)="removeDepartmentFromList(i)" title="إزالة القسم" style="width: 36px; height: 36px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
          </div>
        </div>

        <div class="d-flex gap-2">
          <input type="text" class="form-control flex-1" [(ngModel)]="newDepartmentName" (keyup.enter)="addDepartmentToList()" placeholder="اسم قسم جديد (مثال: الموارد البشرية)">
          <button class="btn-primary" (click)="addDepartmentToList()" [disabled]="!newDepartmentName.trim()" style="white-space: nowrap;">
            إضافة قسم
          </button>
        </div>
      </div>
    </div>

    <div class="modal-footer d-flex gap-3">
      <button class="btn-accent flex-2 d-flex justify-center align-center gap-2" (click)="saveCompany()" [disabled]="isSubmitting || !companyName">
        <span *ngIf="isSubmitting" class="modal-spinner"></span>
        {{ isSubmitting ? 'جاري الحفظ...' : 'حفظ الشركة والأقسام' }}
      </button>
      <button class="btn-secondary flex-1" (click)="closeModal()">إلغاء</button>
    </div>
  </div>
</div>
