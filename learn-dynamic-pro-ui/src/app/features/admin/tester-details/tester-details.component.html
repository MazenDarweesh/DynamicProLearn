<div class="console-container" dir="rtl">
  <app-admin-header 
    *ngIf="testerDetails"
    title="تفاصيل المختبر: {{ testerDetails.name }}" 
    subtitle="مراجعة التقييمات والتعليقات الخاصة بكل درس"
    [showBackBtn]="true">
  </app-admin-header>

  <div class="console-body">
    <app-evaluations-dashboard
      *ngIf="testerDetails"
      [isLoading]="isLoading"
      title="بيانات المختبر وتقييماته"
      [subtitle]="testerDetails.email"
      [name]="testerDetails.name"
      [completedLessons]="testerDetails.completedLessons || 0"
      [totalAssignedLessons]="testerDetails.totalAssignedLessons || 0"
      filterType="version"
      [filterOptions]="uniqueVersions"
      [dataGroups]="formattedVersions">
    </app-evaluations-dashboard>

    <div *ngIf="isLoading" class="d-flex align-center w-100" style="justify-content: center; height: 50vh;">
      <div style="text-align: center;">
        <i class="fi fi-rr-spinner" style="font-size: 32px; color: var(--color-primary); display: inline-block; animation: spin 1s linear infinite;"></i>
        <p class="text-secondary mt-3" style="font-size: 18px; margin: 0;">جاري تحميل بيانات المختبر...</p>
      </div>
    </div>
  </div>
</div>
