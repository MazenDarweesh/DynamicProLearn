<div class="lesson-details">
  <h2 class="mb-4">تعديل بيانات الموديول العامّة</h2>
  
  <div class="form-group mb-3">
    <label>اسم الموديول</label>
    <input type="text" class="form-control" [(ngModel)]="module.name" placeholder="أدخل اسم الموديول">
  </div>

  <div class="form-group mb-4">
    <label>وصف الموديول</label>
    <textarea class="form-control" rows="6" [(ngModel)]="module.description" placeholder="أدخل وصف الموديول..."></textarea>
  </div>
  
  <div style="background: var(--color-bg-page); border: 1px solid var(--color-border); border-radius: 8px; padding: 15px;" class="text-secondary text-sm">
    💡 يمكنك النقر على أي درس في القائمة الجانبية لتعديل تفاصيله الدقيقة (مثل رابط الفيديو، المستوى، والنوع).
  </div>
</div>
