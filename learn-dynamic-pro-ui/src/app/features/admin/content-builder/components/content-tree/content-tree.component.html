<div class="viewer-sidebar">
  <div class="d-flex justify-between align-center mb-4" style="border-bottom: 1px solid var(--color-border); padding-bottom: 15px;">
    <h4 style="margin: 0; color: var(--color-navy); display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3H3v18h18V3z"></path><path d="M21 9H3"></path><path d="M9 21V9"></path></svg>
      شجرة المحتوى
    </h4>
    <div class="d-flex gap-2 align-center">
      <div class="loader" *ngIf="isLoadingTree"></div>
      <button class="btn-primary d-flex align-center gap-2" (click)="onSaveAll()" style="padding: 6px 14px; font-size: 13px;" title="حفظ جميع التعديلات">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        {{ isSaving ? 'جاري الحفظ...' : 'حفظ' }}
      </button>
    </div>
  </div>
  
  <div class="form-group mb-3">
    <div class="d-flex justify-between align-center mb-2">
      <label style="margin: 0;">اختر الموديول</label>
      <button class="btn-primary" style="padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 4px;" (click)="onAddModule()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        إضافة موديول
      </button>
    </div>
    <div class="d-flex gap-2">
      <select class="form-control" [ngModel]="selectedModuleId" (ngModelChange)="onModuleChange($event)">
        <option [ngValue]="null" disabled>-- اختر الموديول --</option>
        <option *ngFor="let mod of modules" [ngValue]="mod.id">{{ mod.name }}</option>
      </select>
      <button *ngIf="selectedModuleId" class="btn-icon-danger" (click)="onDeleteModule()" title="حذف الموديول بالكامل" style="border: 1px solid var(--color-border); background: white; padding: 0 12px; border-radius: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </div>

  <div *ngIf="selectedModuleId && !isLoadingTree">
    <div class="d-flex justify-between align-center mb-3">
      <h5 style="margin: 0; color: var(--color-navy);">الوحدات والدروس</h5>
      <button class="btn-icon" (click)="startAddUnit()" title="إضافة وحدة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

    <div *ngIf="units.length === 0" class="text-secondary text-center py-4 text-sm">
      لا توجد وحدات. أضف وحدة للبدء.
    </div>

    <div class="unit-tree" *ngFor="let unit of units; let uIndex = index">
      <div class="unit-header d-flex justify-between align-center">
        <div class="d-flex align-center gap-2 flex-1" style="max-width: 80%;">
          <strong>{{ uIndex + 1 }}.</strong>
          <input type="text" class="form-control-minimal text-sm" [(ngModel)]="unit.name" placeholder="اسم الوحدة">
        </div>
        <div class="d-flex gap-1">
          <button class="btn-icon-danger" (click)="onDeleteUnit(unit)" title="حذف الوحدة"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
          <button class="btn-icon" (click)="startAddLesson(unit)" title="إضافة درس"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
        </div>
      </div>

      <div class="lesson-list">
        <div class="lesson-item" 
             *ngFor="let lesson of unit.lessons; let lIndex = index"
             [class.active]="selectedLesson === lesson"
             (click)="onSelectLesson(lesson)">
          <div class="d-flex justify-between align-center w-100">
            <span class="text-sm text-truncate" style="max-width: 70%;">{{ uIndex + 1 }}.{{ lIndex + 1 }} {{ lesson.title || 'درس جديد' }}</span>
            <button class="btn-icon-danger btn-sm" (click)="onDeleteLesson(unit, lesson, $event)" title="حذف الدرس"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>
        </div>

        <!-- Inline Lesson Input -->
        <div class="lesson-item lesson-item-new" *ngIf="addingLessonUnitId === unit.id">
          <div class="d-flex align-center w-100">
            <input type="text" class="form-control text-sm w-100" [(ngModel)]="newLessonTitle"
                   (keydown.enter)="onSaveNewLesson(unit)" (keydown.escape)="cancelAddLesson()"
                   (blur)="onSaveNewLesson(unit)" autofocus placeholder="اسم الدرس الجديد واضغط Enter...">
          </div>
        </div>
      </div>
    </div>

    <!-- Inline Unit Input -->
    <div class="unit-tree" *ngIf="isAddingUnit" style="border: 1px dashed var(--color-primary);">
      <div class="unit-header d-flex justify-between align-center">
        <div class="d-flex align-center gap-2 flex-1">
          <strong>+</strong>
          <input type="text" class="form-control text-sm w-100" [(ngModel)]="newUnitName" 
                 (keydown.enter)="onSaveNewUnit()" (keydown.escape)="cancelAddUnit()"
                 (blur)="onSaveNewUnit()" autofocus placeholder="اسم الوحدة الجديدة واضغط Enter...">
        </div>
      </div>
    </div>
  </div>
</div>
