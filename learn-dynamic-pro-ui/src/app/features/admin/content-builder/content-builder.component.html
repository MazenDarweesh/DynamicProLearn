<app-admin-header [showBackBtn]="true"></app-admin-header>

<div class="console-container dashboard-container" dir="rtl">
  <!-- Page Title & Action -->
  <div style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 30px 30px 0;">
    <div class="d-flex justify-between w-100 align-center mb-0">
      <div>
        <h2 class="m-0" style="color: var(--color-navy)">مُنشئ المحتوى</h2>
        <p class="text-secondary text-sm m-0 mt-1">إدارة وتعديل المناهج، الوحدات، والدروس التفاعلية</p>
      </div>
      <app-admin-action-button label="إضافة موديول" (clicked)="openAddModuleModal()">
      </app-admin-action-button>
    </div>
  </div>

  <div class="console-body">
    <!-- Sidebar: Modules and Units Tree -->
    <app-content-tree
      [modules]="modules"
      [selectedModuleId]="selectedModuleId"
      [isLoadingTree]="isLoadingTree"
      [isSaving]="isSaving"
      [units]="units"
      [selectedLesson]="selectedLesson"
      (moduleChange)="onModuleChange($event)"
      (deleteModule)="deleteModule($event)"
      (saveAll)="saveAll()"
      (createUnit)="createUnit($event)"
      (deleteUnit)="deleteUnit($event)"
      (createLesson)="createLesson($event)"
      (deleteLesson)="deleteLesson($event)"
      (selectLesson)="selectLesson($event)">
    </app-content-tree>

    <!-- Main Area: Lesson/Module Details Editor -->
    <div class="viewer-main">
      <!-- No Module Selected -->
      <div *ngIf="!selectedModuleId" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5; margin-bottom: 15px;">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="9"></line>
          <line x1="9" y1="13" x2="15" y2="13"></line>
          <line x1="9" y1="17" x2="13" y2="17"></line>
        </svg>
        <p>يرجى اختيار موديول من القائمة الجانبية لعرض وتعديل بياناته.</p>
      </div>

      <!-- Module Details Editor (No Lesson Selected) -->
      <app-module-editor
        *ngIf="selectedModuleId && !selectedLesson && selectedModule"
        [module]="selectedModule">
      </app-module-editor>

      <!-- Lesson Details Editor -->
      <app-lesson-editor
        *ngIf="selectedLesson"
        [lesson]="selectedLesson"
        [lookups]="lookups"
        [units]="units">
      </app-lesson-editor>
    </div>
  </div>
</div>

<!-- ── Add Module Modal (shared app-admin-modal) ───────────────────────── -->
<app-admin-modal
  [show]="showAddModuleModal"
  title="إضافة موديول جديد"
  subtitle="أدخل اسم الموديول، وسيتم إضافته للشجرة لبناء الوحدات والدروس بداخله."
  confirmLabel="حفظ وإضافة"
  [loading]="isSubmittingModal"
  [confirmDisabled]="!newModuleName"
  (closed)="closeAddModuleModal()"
  (confirmed)="submitNewModule()">

  <!-- Modal Icon -->
  <svg modal-icon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
  </svg>

  <!-- Body Content -->
  <div class="form-group mb-3">
    <label class="form-label text-secondary text-sm mb-2 d-block">اسم الموديول</label>
    <input type="text" class="form-control" [(ngModel)]="newModuleName"
           placeholder="مثال: مقدمة في النظام">
  </div>

</app-admin-modal>
