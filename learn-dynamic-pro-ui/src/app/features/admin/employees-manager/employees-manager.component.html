<app-admin-header></app-admin-header>

<div class="dashboard-container" dir="rtl">
  <div class="d-flex justify-between w-100 align-center mb-4">
    <h2 class="m-0" style="color: var(--color-navy)">إدارة الموظفين </h2>

    <div class="d-flex align-center gap-3">
      <select class="form-control" style="width: 200px;" [(ngModel)]="filterCompanyId" (change)="onFilterChange()">
        <option [ngValue]="null">كل الشركات</option>
        <option *ngFor="let c of companies" [ngValue]="c.id">{{ c.name }}</option>
      </select>

      <select class="form-control" style="width: 200px;" [(ngModel)]="filterDepartmentId" (change)="loadEmployees()">
        <option [ngValue]="null">كل الأقسام</option>
        <option *ngFor="let d of filteredDepartments" [ngValue]="d.id">{{ d.name }}</option>
      </select>

      <div class="stats-badge"
        style="background: rgba(67, 56, 202, 0.1); color: #4338ca; padding: 10px 15px; border-radius: 8px; font-weight: 500; font-size: 14px; white-space: nowrap;">
        إجمالي الموظفين: <strong style="font-size: 16px; margin-right: 4px;">{{ totalEmployees }}</strong>
      </div>

      <app-admin-action-button label="إضافة مستخدم" (clicked)="openAddModal()">
      </app-admin-action-button>
    </div>
  </div>

  <div class="card p-0">
    <app-expandable-table *ngIf="!isLoading" [data]="employees" keyProp="userId" [colspan]="4" [expandable]="false">
      <!-- HEADER -->
      <ng-template #header>
        <th style="color: var(--color-primary)">اسم الموظف</th>
        <th style="color: var(--color-primary)">الجهة</th>
        <th style="color: var(--color-primary); width: 300px;">التقدم في المناهج</th>
        <th style="color: var(--color-primary); text-align: left;">الإجراءات</th>
      </ng-template>

      <!-- ROW -->
      <ng-template #row let-emp>
        <td class="fw-500 text-primary" style="text-align: right; padding-right: 20px;">
          <a [routerLink]="['/admin/employees', emp.userId]" class="employee-link">
            {{ emp.userName }}
          </a>
        </td>
        <td style="text-align: right; padding-right: 20px;">
          <div class="d-flex align-center gap-2">
            <span class="badge"
              style="background: rgba(245, 130, 32, 0.1); color: var(--color-accent); font-size: 13px;">
              <i class="fi fi-rr-building" style="margin-left: 4px;"></i> {{ emp.companyName }}
            </span>
            <span class="badge" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-size: 13px;">
              <i class="fi fi-rr-users" style="margin-left: 4px;"></i> {{ emp.departmentName }}
            </span>
          </div>
        </td>
        <td style="text-align: left; padding-left: 20px;">
          <app-progress-bar [completed]="emp.completedLessons" [total]="emp.totalLessons"></app-progress-bar>
        </td>
        <td style="text-align: left;">
          <div class="d-flex gap-2 justify-end">
            <app-admin-action-icon action="edit" (clicked)="openEditModal(emp)"></app-admin-action-icon>
            <app-admin-action-icon action="delete" (clicked)="deleteEmployee(emp.userId)"></app-admin-action-icon>
          </div>
        </td>
      </ng-template>
    </app-expandable-table>

    <div class="loader-container" *ngIf="isLoading">
      <div class="loader"></div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-between align-center mt-4 p-4" *ngIf="!isLoading && totalEmployees > pageSize">
      <div class="text-sm text-secondary">
        عرض {{ (currentPage - 1) * pageSize + 1 }} إلى {{ getMathMin(currentPage * pageSize, totalEmployees) }} من {{
        totalEmployees }} موظف
      </div>
      <div class="d-flex gap-2">
        <button class="btn-outline" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">السابق</button>
        <button class="btn-outline" [disabled]="currentPage * pageSize >= totalEmployees"
          (click)="changePage(currentPage + 1)">التالي</button>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Employee Modal -->
<app-admin-modal
  [show]="showModal"
  [title]="isEditMode ? 'تعديل بيانات الموظف' : 'إضافة موظف جديد'"
  [confirmLabel]="isEditMode ? 'حفظ التعديلات' : 'إضافة الموظف'"
  [loading]="isLoading"
  (closed)="closeModal()"
  (confirmed)="saveEmployee()">

  <div class="form-group mb-3">
    <label class="form-label text-secondary text-sm mb-2 d-block">اسم المستخدم</label>
    <input type="text" class="form-control" [(ngModel)]="formData.username" placeholder="أدخل اسم المستخدم">
  </div>

  <div class="form-group mb-3">
    <label class="form-label text-secondary text-sm mb-2 d-block">كلمة المرور {{ isEditMode ? 'الجديدة (اختياري)' : '' }}</label>
    <input type="password" class="form-control" [(ngModel)]="formData.password"
      [placeholder]="isEditMode ? 'اتركه فارغاً لعدم التغيير' : 'أدخل كلمة المرور'">
  </div>

  <div class="form-group mb-3">
    <label class="form-label text-secondary text-sm mb-2 d-block">الشركة</label>
    <select class="form-control" [(ngModel)]="formData.companyId" (change)="onFormCompanyChange()">
      <option *ngFor="let c of companies" [ngValue]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <div class="form-group mb-4">
    <label class="form-label text-secondary text-sm mb-2 d-block">القسم</label>
    <select class="form-control" [(ngModel)]="formData.departmentId">
      <option *ngFor="let d of filteredDepartmentsForForm" [ngValue]="d.id">{{ d.name }}</option>
    </select>
  </div>

</app-admin-modal>
