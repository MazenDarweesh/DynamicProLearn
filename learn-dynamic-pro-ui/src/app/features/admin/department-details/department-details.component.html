<app-admin-header 
  title="تفاصيل القسم: {{ departmentName }}" 
  subtitle="استعراض وإدارة تقدم القسم في المناهج المخصصة"
  [showBackBtn]="true">
</app-admin-header>

<div class="card p-4 fade-in" style="margin: 20px;">
  
  <div class="d-flex justify-between align-center mb-4">
    <div class="stats-badge" style="background: #e0e7ff; color: #4338ca; padding: 10px 15px; border-radius: 8px; font-weight: bold;">
      <i class="fi fi-rr-users"></i>
      إجمالي المتدربين: {{ totalUsers }}
    </div>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-center p-5">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!isLoading && modules.length === 0" class="empty-state p-5" style="text-align: center; color: #64748b;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px; opacity: 0.5;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    <p class="mt-3">لا توجد مناهج مخصصة لهذا القسم بعد.</p>
  </div>

  <div class="table-container" *ngIf="!isLoading && modules.length > 0">
    <table class="data-table" style="width: 100%;">
      <thead>
        <tr>
          <th style="width: 40px;"></th>
          <th>الموديول</th>
          <th>التقدم</th>
        </tr>
      </thead>
      <tbody>
        <!-- Module Row -->
        <ng-container *ngFor="let module of modules">
          <tr>
            <td>
              <button class="expand-btn" (click)="toggleModule(module.moduleId)">
                <svg *ngIf="!expandedModules[module.moduleId]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                <svg *ngIf="expandedModules[module.moduleId]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
            </td>
            <td class="fw-500 text-primary" style="color: #4338ca;">
              <div class="d-flex align-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                {{ module.name }}
              </div>
            </td>
            <td>
              <app-progress-bar [completed]="module.completedLessons" [total]="module.totalLessons"></app-progress-bar>
            </td>
          </tr>
          
          <!-- Expanded Units -->
          <tr *ngIf="expandedModules[module.moduleId]" class="expanded-row">
            <td colspan="3" class="p-0 border-0">
              <div class="sub-table-container" style="background: #f8fafc; padding: 15px; border-bottom: 1px solid #e2e8f0;">
                <table class="sub-table" style="width: 100%;">
                  <thead>
                    <tr>
                      <th style="width: 40px;"></th>
                      <th>الوحدة</th>
                    </tr>
                  </thead>
                  <tbody>
                    <ng-container *ngFor="let unit of module.units">
                      <tr>
                        <td>
                          <button class="expand-btn" (click)="toggleUnit(unit.unitId)">
                            <svg *ngIf="!expandedUnits[unit.unitId]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            <svg *ngIf="expandedUnits[unit.unitId]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                          </button>
                        </td>
                        <td class="fw-500" style="color: #a16207;">
                          <div class="d-flex align-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                            {{ unit.name }}
                          </div>
                        </td>
                      </tr>

                      <!-- Expanded Lessons -->
                      <tr *ngIf="expandedUnits[unit.unitId]">
                        <td colspan="2" class="p-0 border-0">
                          <div class="sub-sub-table-container" style="background: #fff; padding: 10px 10px 10px 40px; border: 1px solid #e2e8f0; border-top: none;">
                            <table class="sub-table" style="width: 100%; box-shadow: none;">
                              <tbody>
                                <tr *ngFor="let lesson of unit.lessons" style="border-bottom: 1px dashed #e2e8f0;">
                                  <td style="color: #15803d; width: 40%;">
                                    <div class="d-flex align-center gap-2">
                                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                      {{ lesson.name }}
                                    </div>
                                  </td>
                                  <td style="width: 30%;">
                                    <span class="text-sm">أتم الدرس: <strong>{{ lesson.completedUsersCount }} / {{ lesson.totalUsersCount }}</strong> طالب</span>
                                  </td>
                                  <td style="text-align: left; width: 30%;">
                                    <span *ngIf="lesson.isFullyCompletedByAll" class="badge badge-success" style="margin-left: 10px;">
                                      <i class="fi fi-rr-badge-check"></i> مكتمل للجميع
                                    </span>
                                    
                                    <button *ngIf="!lesson.isFullyCompletedByAll" 
                                            class="btn btn-sm btn-primary" 
                                            style="padding: 4px 10px; font-size: 12px; border-radius: 4px; margin-left: 5px;"
                                            (click)="markLessonComplete(lesson.lessonId)"
                                            title="تحديد كمكتمل للجميع (بواسطة الإدارة)">
                                      <i class="fi fi-rr-check"></i> اكتمال للكل
                                    </button>

                                    <button *ngIf="lesson.completedUsersCount > 0" 
                                            class="btn btn-sm btn-outline-danger" 
                                            style="padding: 4px 10px; font-size: 12px; border-radius: 4px; color: #dc2626; border: 1px solid #dc2626; background: transparent; cursor: pointer;"
                                            (click)="unmarkLessonComplete(lesson.lessonId)"
                                            title="إلغاء الاكتمال">
                                      <i class="fi fi-rr-cross"></i> إلغاء
                                    </button>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </td>
                      </tr>
                    </ng-container>
                  </tbody>
                </table>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
