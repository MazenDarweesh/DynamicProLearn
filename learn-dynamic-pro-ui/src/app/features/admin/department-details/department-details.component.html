<app-admin-header 
  title="تفاصيل القسم: {{ departmentName }}" 
  subtitle="استعراض وإدارة تقدم القسم في المناهج المخصصة">
</app-admin-header>

<div class="card p-4 fade-in" style="margin: 20px;">
  
  <div class="d-flex justify-between align-center mb-4">
    <div class="stats-badge">
      <i class="fi fi-rr-users"></i>
      إجمالي المتدربين: <strong>{{ totalUsers }}</strong>
    </div>
    <button class="btn btn-secondary" (click)="goBack()">
      <i class="fi fi-rr-arrow-right"></i> عودة
    </button>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-center p-5">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!isLoading && modules.length === 0" class="empty-state p-5">
    <i class="fi fi-rr-books" style="font-size: 40px; color: #cbd5e1;"></i>
    <p class="mt-3">لا توجد مناهج مخصصة لهذا القسم بعد.</p>
  </div>

  <!-- Shared Nested List UI -->
  <div class="nested-list-container" *ngIf="!isLoading && modules.length > 0">
    
    <!-- Modules Loop -->
    <div class="list-item-group" *ngFor="let module of modules">
      
      <!-- Module Header -->
      <div class="list-item-header level-1" (click)="toggleModule(module.moduleId)">
        <div class="d-flex align-center gap-3">
          <button class="btn-icon">
            <i class="fi" [ngClass]="expandedModules[module.moduleId] ? 'fi-rr-angle-down' : 'fi-rr-angle-left'"></i>
          </button>
          <div class="item-icon module-icon"><i class="fi fi-rr-book-alt"></i></div>
          <span class="item-title">{{ module.name }}</span>
        </div>
        <div class="item-progress">
          <app-progress-bar [completed]="module.completedLessons" [total]="module.totalLessons"></app-progress-bar>
        </div>
      </div>

      <!-- Units Container (Expandable) -->
      <div class="list-item-content" *ngIf="expandedModules[module.moduleId]">
        
        <div class="list-item-group" *ngFor="let unit of module.units">
          
          <!-- Unit Header -->
          <div class="list-item-header level-2" (click)="toggleUnit(unit.unitId)">
            <div class="d-flex align-center gap-3">
              <button class="btn-icon">
                <i class="fi" [ngClass]="expandedUnits[unit.unitId] ? 'fi-rr-angle-down' : 'fi-rr-angle-left'"></i>
              </button>
              <div class="item-icon unit-icon"><i class="fi fi-rr-folder"></i></div>
              <span class="item-title">{{ unit.name }}</span>
            </div>
          </div>

          <!-- Lessons Container (Expandable) -->
          <div class="list-item-content" *ngIf="expandedUnits[unit.unitId]">
            
            <div class="list-item level-3" *ngFor="let lesson of unit.lessons">
              <div class="d-flex align-center gap-3">
                <div class="item-icon lesson-icon"><i class="fi fi-rr-play-alt"></i></div>
                <span class="item-title">{{ lesson.name }}</span>
              </div>
              
              <div class="d-flex align-center gap-4">
                <div class="users-progress">
                  <span class="text-sm">أتم الدرس: <strong>{{ lesson.completedUsersCount }} / {{ lesson.totalUsersCount }}</strong> طالب</span>
                </div>
                
                <button *ngIf="!lesson.isFullyCompletedByAll" 
                        class="btn btn-outline-primary btn-sm" 
                        (click)="markLessonComplete(lesson.lessonId)"
                        title="تحديد كمكتمل للجميع (بواسطة الإدارة)">
                  <i class="fi fi-rr-check"></i> اكتمال للكل
                </button>

                <span *ngIf="lesson.isFullyCompletedByAll" class="badge badge-success">
                  <i class="fi fi-rr-badge-check"></i> مكتمل 100%
                </span>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>
</div>
