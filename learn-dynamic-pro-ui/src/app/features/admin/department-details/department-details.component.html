<app-admin-header 
  title="تفاصيل القسم: {{ departmentName }}" 
  subtitle="استعراض وإدارة تقدم القسم في المناهج المخصصة"
  [showBackBtn]="true">
</app-admin-header>

<div class="dashboard-container">
  <div class="d-flex justify-between w-100 align-center mb-4">
    <h2 class="m-0" style="color: var(--color-navy)">مناهج القسم: {{ departmentName }}</h2>
    <div class="d-flex align-center gap-3">
      <button (click)="toggleExpandAll()" 
              style="background: rgba(67, 56, 202, 0.1); color: #4338ca; padding: 10px 15px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 14px; transition: opacity 0.2s;"
              onmouseover="this.style.opacity='0.8'"
              onmouseout="this.style.opacity='1'">
        <i class="fi" [ngClass]="isAllExpanded ? 'fi-rr-compress-alt' : 'fi-rr-expand-arrows-alt'" style="margin-top: 3px;"></i>
        {{ isAllExpanded ? 'إخفاء الكل' : 'عرض الكل' }}
      </button>
      <div class="stats-badge" style="background: rgba(67, 56, 202, 0.1); color: #4338ca; padding: 10px 15px; border-radius: 8px; font-weight: 500; font-size: 14px;">
        إجمالي المتدربين: <strong style="font-size: 16px; margin-right: 4px;">{{ totalUsers }}</strong>
      </div>
    </div>
  </div>

  <div class="card p-0">
    <div *ngIf="isLoading"><p class="text-center p-4">جاري التحميل...</p></div>

    <div *ngIf="!isLoading && modules.length === 0" class="empty-state p-5" style="text-align: center; color: #64748b;">
      <p class="mt-3">لا توجد مناهج مخصصة لهذا القسم بعد.</p>
    </div>

    <!-- MODULES TABLE -->
    <app-curriculum-viewer 
      [modules]="modules"
      [isAllExpanded]="isAllExpanded"
      [isLoading]="isLoading"
      [isDepartmentView]="true"
      [isStudentView]="false"
      (onMarkLessonComplete)="markLessonComplete($event)"
      (onUnmarkLessonComplete)="unmarkLessonComplete($event)">
    </app-curriculum-viewer>

  </div>
</div>
