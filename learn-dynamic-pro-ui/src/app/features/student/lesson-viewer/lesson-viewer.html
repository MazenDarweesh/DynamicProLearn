<div class="console-container" dir="rtl">
  <app-admin-header title="عارض الدروس" subtitle="DynamicProLearn" [showBackBtn]="true" backUrl="/student?tab=browse"></app-admin-header>

  <div class="console-body">
    <!-- Sidebar -->
    <app-lesson-sidebar 
      [data]="units" 
      type="units"
      [isLoading]="isLoading"
      [activeLessonId]="activeLesson?.id"
      (lessonSelected)="loadLesson($event)">
    </app-lesson-sidebar>

    <!-- Main Area -->
    <div class="viewer-main">
      <div *ngIf="isLoadingLesson" class="video-placeholder text-white">
        جاري تحميل الدرس...
      </div>

      <div *ngIf="!isLoadingLesson && !activeLesson" class="video-placeholder text-white"
        style="background-color: var(--color-bg-card); color: var(--color-navy) !important; border: 1px solid var(--color-border);">
        يرجى اختيار درس من القائمة الجانبية
      </div>

      <div *ngIf="!isLoadingLesson && activeLesson">
        <div class="video-placeholder">
          <!-- Show iframe if we have a safe video URL -->
          <iframe *ngIf="safeVideoUrl" [src]="safeVideoUrl" allowfullscreen></iframe>

          <!-- Show placeholder if no video URL -->
          <div *ngIf="!safeVideoUrl" class="text-white text-center" style="padding: 40px 0;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              style="opacity: 0.5; margin-bottom: 10px;">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            <p style="opacity: 0.7;">لا يوجد فيديو متاح لهذا الدرس</p>
          </div>
        </div>

        <div *ngIf="activeLesson.pdfUrl || activeLesson.externalLink" class="lesson-resources"
          style="display: flex; gap: 15px; margin: 20px 0;">
          <a *ngIf="activeLesson.pdfUrl" [href]="activeLesson.pdfUrl" target="_blank" class="btn-resource pdf-btn"
            style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(220, 38, 38, 0.1); color: #dc2626; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 1px solid rgba(220, 38, 38, 0.2); transition: 0.2s;">
            <i class="fi fi-rr-document" style="font-size: 20px;"></i>
            عرض ملف الPDF المرفق
          </a>
          <a *ngIf="activeLesson.externalLink" [href]="activeLesson.externalLink" target="_blank"
            class="btn-resource link-btn"
            style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(67, 56, 202, 0.1); color: var(--color-primary); padding: 15px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 1px solid rgba(67, 56, 202, 0.2); transition: 0.2s;">
            <i class="fi fi-rr-link" style="font-size: 20px;"></i>
            زيارة الرابط الخارجي (Drive وغيرها)
          </a>
        </div>

        <div class="lesson-details">
          <div class="d-flex justify-between align-start">
            <div>
              <div class="badge">{{ activeLesson.levelLabel }} - {{ activeLesson.typeLabel }}</div>
              <h2>{{ activeLesson.title }}</h2>
              <p class="text-secondary">تابع شرح الدرس لتعزيز معرفتك وفهمك للموضوع.</p>
            </div>

            <div>
              <button class="btn-accent" [class.btn-success]="activeLesson.isCompleted" [disabled]="isSubmitting"
                (click)="toggleCompletion()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path *ngIf="!activeLesson.isCompleted" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline *ngIf="!activeLesson.isCompleted" points="22 4 12 14.01 9 11.01"></polyline>
                  <polyline *ngIf="activeLesson.isCompleted" points="20 6 9 17 4 12"></polyline>
                </svg>
                {{ isSubmitting ? 'جاري الحفظ...' : (activeLesson.isCompleted ? 'إلغاء التحديد كمكتمل' : 'تحديد كمكتمل')
                }}
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
