<div class="console-container" dir="rtl">
  <app-admin-header title="بوابة المتدرب" subtitle="DynamicProLearn">
    <div class="tabs-header d-flex gap-3 pt-3">
      <button class="btn-tab" [class.active]="activeTab === 'resume'" (click)="switchTab('resume')">متابعة التعلم</button>
      <button class="btn-tab" [class.active]="activeTab === 'browse'" (click)="switchTab('browse')">تصفح الموديولات</button>
    </div>
  </app-admin-header>

  <div class="console-body">

    <!-- RESUME TAB -->
    <div class="panel" *ngIf="activeTab === 'resume'" style="background: transparent; border: none; padding: 0;">
      <app-continue-learning></app-continue-learning>
    </div>

    <!-- BROWSE TAB -->
    <div class="panel" *ngIf="activeTab === 'browse'">
      <div class="panel-header d-flex justify-between align-center">
        <h3 class="panel-title">📚 الموديولات المخصصة لك</h3>
      </div>
      <div class="panel-content">

        <div *ngIf="isLoading" class="loading">جاري تحميل الموديولات...</div>

        <div *ngIf="!isLoading && modules.length === 0" class="empty-state">
          لا يوجد موديولات مخصصة لقسمك حالياً.
        </div>

        <div class="grid"
          style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
          <div class="item-card module-card d-flex flex-column" *ngFor="let mod of modules">
            <div class="d-flex justify-between align-start mb-2">
              <div>
                <h4 class="text-primary m-0 mb-1">{{ mod.name }}</h4>
                <p class="text-secondary text-sm mt-1 mb-2">{{ mod.description }}</p>
              </div>
            </div>

            <div class="mt-auto pt-3 border-top" style="border-top: 1px solid var(--color-border); margin-top: 15px;">
              <div style="margin-bottom: 12px; margin-top: 8px;">
                <app-progress-bar [completed]="mod.completedLessons" [total]="mod.totalLessons" width="100%">
                </app-progress-bar>
              </div>

              <button class="btn-accent w-100 d-flex justify-center align-center gap-2" (click)="openLesson(mod.id)">
                الدخول للموديول (الوحدات)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
